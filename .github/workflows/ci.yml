# Hand-written, so that regenerating ost-source-ci.yml cannot lose it. ost generates the source
# jobs with `--reusable-source` and leaves the choice of which changes build to this caller: changes
# to Markdown, docs/, LICENSE, or the documentation check alone do not build (docs.yml checks them). No Markdown file is packaged today; if one
# becomes part of a package, exempt it from paths-ignore.
#
# Pull requests run the pull_request lane of openstrata.ci.yaml; pushes to main run the main lane;
# a manual dispatch runs both.
#
# Fork-PR safety: this never publishes and uses no secrets.
name: ci

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "tools/check_docs.py", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "tools/check_docs.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    uses: ./.github/workflows/ost-source-ci.yml
