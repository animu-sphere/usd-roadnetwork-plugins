# OpenStrata plugin bundle manifest.
# A plugin is a self-describing bundle, not a bare shared library: this file is
# the contract `ost plugin inspect|build|doctor|test` resolve against.
manifest:
  schema: openstrata.plugin/v1alpha1
plugin:
  name: roadnetwork-opendrive
  version: 0.1.0
  kind: usd-fileformat
# SPDX license for this plugin's own code. Surfaced by `ost plugin inspect` and
# recorded in the package manifest. Change it to match your project's license.
license: Apache-2.0
# Third-party notices shipped in every package. The CARLA test networks are
# MIT-licensed; see tests/fixtures/carla/.
notices:
  - THIRD_PARTY_NOTICES.md
runtime:
  # The OpenUSD version range this plugin tolerates. The runtime supplies the
  # certified point within it.
  openusd: ">=25.05,<27.0"
  # Source bundles do not hard-code C++ ABI; `ost plugin doctor` compares the
  # resolved target/runtime ABI when a built or packaged manifest records one.
  # To pin it, `cxx_abi` accepts a scalar (`msvc143`), the `inherit` sentinel
  # (defer to the runtime), or a per-OS map for a cross-platform bundle:
  #   cxx_abi: { windows: msvc143, linux: libstdcxx, macos: libcxx }
provides:
  - usd-fileformat:xodr
requires:
  capabilities: [usd-stage-read]
  libraries:
    - id: roadnetwork-core
      version: ">=0.1,<0.2"
    - id: roadnetwork-usd
      version: ">=0.1,<0.2"
usd:
  # Where this bundle's plugInfo.json lives, relative to the bundle root.
  plug_info: plugin/resources/roadnetwork-opendrive/plugInfo.json
tests:
  smoke: [tests/fixtures/basic.xodr, tests/fixtures/decoder/network.xodr]
  roundtrip: [tests/fixtures/basic.xodr]
  # Each must fail to open with its ODR- or RN- code
  # (docs/reference/DIAGNOSTICS.md).
  negative:
    - tests/fixtures/invalid.xodr
    - tests/fixtures/reader/not-utf8.xodr
    - tests/fixtures/reader/wrong-root.xodr
    - tests/fixtures/reader/namespaced-root.xodr
    - tests/fixtures/reader/missing-header.xodr
    - tests/fixtures/reader/version-malformed.xodr
    - tests/fixtures/reader/version-unsupported.xodr
    - tests/fixtures/decoder/missing-attribute.xodr
    - tests/fixtures/decoder/invalid-number.xodr
    - tests/fixtures/decoder/unknown-lane-type.xodr
    - tests/fixtures/decoder/duplicate-plan-view.xodr
    - tests/fixtures/decoder/lane-group-mismatch.xodr
    - tests/fixtures/decoder/lane-link-without-road-link.xodr
    - tests/fixtures/decoder/lane-link-into-junction.xodr
    - tests/fixtures/decoder/connection-unresolved.xodr
    - tests/fixtures/decoder/spiral.xodr
    - tests/fixtures/decoder/superelevation.xodr
    - tests/fixtures/decoder/lane-border.xodr
    - tests/fixtures/decoder/direct-junction.xodr
    - tests/fixtures/decoder/temporary-lane-layer.xodr
    - tests/fixtures/decoder/unknown-lane-element.xodr
    - tests/fixtures/decoder/duplicate-road.xodr
    - tests/fixtures/decoder/unresolved-link.xodr
    - tests/fixtures/decoder/unresolved-lane-link.xodr
    - tests/fixtures/decoder/non-finite.xodr
    - tests/fixtures/decoder/plan-view-gap.xodr
    - tests/fixtures/decoder/inner-border.xodr
