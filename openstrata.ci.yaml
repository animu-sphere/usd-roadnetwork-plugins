# OpenStrata CI support matrix for usd-roadnetwork-plugins.
#
# This file is the CI contract. After editing it, regenerate the source
# workflow with
#
#   ost ci generate github --reusable-source --out .github/workflows/ost-source-ci.yml --force
#
# and do not edit that file by hand. .github/workflows/ci.yml is hand-written
# and decides which changes run it.
#
# Each platform and lane has two cells, which together cover the lifecycle
# SCF-02 measured locally:
#
#   workspace-*  builds the composed root (both libraries and the bundle) and
#                runs its CTest suite (`verify: test`): the file-format
#                contract, writer, and catalog tests.
#   opendrive-*  builds the roadnetwork-opendrive bundle with its required
#                libraries, runs its verification pyramid up to L5, and
#                packages it.
#
# The workspace cells stop at `test` on purpose. In ost 0.23.21 the generated
# workspace job runs the pyramid right after `ost build`, which does not write
# the library install snapshots `ost plugin test --workspace` reads, so
# `verify: pyramid` and `verify: package` fail on a clean checkout with
# WORKSPACE_LIBRARY_RUNTIME_MISSING
# (https://github.com/animu-sphere/open-strata/issues/304). The bundle cells
# run `ost plugin build` first, which does. Merge them back into
# `verify: package` workspace cells once a fixed ost is bootstrapped.
#
# RUNTIME PINS. The three runtimes are the OpenUSD 26.08 imaging leaves of
# ost's canonical runtime matrix (Python 3.13, `sdk` layout, SBOM and
# provenance attached). They are adopted unchanged from the sibling
# usd-gltf-plugins and usd-3dgs-plugins matrices, which run them on hosted
# runners:
#
#   windows  leaf 26.08-gl-windows-x86_64
#   linux    leaf 26.08-gl-linux-x86_64
#   macos    leaf 26.08-metal-macos-arm64
#
# Neither the OCI manifest digest nor `runtime_artifact` is stable across a
# republish; re-pin both together from the producer's push output.
#
# HOST PYTHON. `ost runtime validate` links and runs a C++ consumer. The
# Windows runtime bundles no interpreter and its USD DLLs import python313.dll,
# so every cell declares the host Python, Windows included.
#
# X11 ON LINUX. OpenUSD 26.08's MaterialX 1.39.5 exports an unconditional
# `find_dependency(X11 REQUIRED COMPONENTS Xt)` on non-Apple UNIX, so the
# Linux cells install the X11 development headers.
schema: 1

bootstrap:
  ost:
    version: "0.23.21"
    repository: animu-sphere/open-strata

runners:
  windows:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  linux:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required
  macos:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required

cells:
  - name: workspace-pr-windows
    kind: workspace
    lane: pull_request
    runner: windows
    runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
    require_openusd: cy2026/windows/x86_64/gl
    require_openusd_version: "26.08"
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
      expected_oci_digest: sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
    platform: cy2026
    profile: usd
    host_python: "3.13"
    verify: test
  - name: opendrive-pr-windows
    lane: pull_request
    runner: windows
    runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
    require_openusd: cy2026/windows/x86_64/gl
